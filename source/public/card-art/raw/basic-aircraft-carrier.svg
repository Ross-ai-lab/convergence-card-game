<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aircraft Carrier</title>
  <desc id="desc">A stylized aircraft carrier cutting through a dark blue sea beneath a geometric sky.</desc>
  <defs>
