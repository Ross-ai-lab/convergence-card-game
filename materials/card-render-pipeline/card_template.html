<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
{{FONT_FACES}}

* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#141118; }

/* ---- 750 x 1050 design space (rendered at 2x => 1500x2100) ---- */
#canvas{
  position:relative; width:750px; height:1050px; background:#141118;
  font-family:'Nunito',sans-serif; overflow:hidden;
}

/* ===== METAL FRAME (full-bleed: fills the whole image, no white margin) ===== */
#card{
  position:absolute; inset:0; border-radius:12px;
  background:
    linear-gradient(135deg, var(--metal-light) 0%, var(--metal-mid) 38%, var(--metal-dark) 70%, var(--metal-mid) 100%);
  box-shadow:
    inset 0 0 0 3px rgba(0,0,0,.35),
    inset 0 0 20px rgba(0,0,0,.5);
}
/* inner textured well (side rails show through beside the description) */
#well{
  position:absolute; inset:16px; border-radius:10px; overflow:hidden;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 3px, rgba(0,0,0,.05) 3px 7px),
    linear-gradient(160deg, var(--rail-light), var(--rail-dark));
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.55), inset 0 0 22px rgba(0,0,0,.5);
}

/* ===== ART (fills edge-to-edge under the banner) ===== */
#art{
  position:absolute; left:0; right:0; top:52px; height:492px; overflow:hidden;
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.7);
  background:#0c0c10;
}
#art img{ width:100%; height:100%; object-fit:cover; object-position:center 26%; display:block; }

/* ===== NAME BANNER (spans full card width) ===== */
#banner{
  position:absolute; top:4px; left:5px; right:5px; height:64px;
  display:flex; align-items:center; justify-content:center;
  background:
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.34)),
    linear-gradient(180deg, var(--banner-light), var(--banner-dark));
  border:3px solid var(--metal-light);
  border-radius:8px;
  clip-path: polygon(2% 0, 98% 0, 100% 50%, 98% 100%, 2% 100%, 0 50%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 3px 7px rgba(0,0,0,.45);
}
#banner .name{
  font-family:'Baloo 2',cursive; font-weight:700; color:#fff;
  font-size:46px; line-height:1; white-space:nowrap;
  text-shadow: 0 2px 3px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.9); padding:0 8px;
}

/* ===== CIRCULAR GEM BADGES (mana / atk / hp) ===== */
.gembadge{
  position:absolute; display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  background: radial-gradient(circle at 50% 42%, var(--badge-dark) 0%, var(--badge-mid) 66%, var(--badge-light) 100%);
  border:3px solid var(--metal-light);
  box-shadow: inset 0 2px 5px rgba(255,255,255,.35), inset 0 -4px 8px rgba(0,0,0,.6), 0 3px 6px rgba(0,0,0,.5);
  font-family:'Baloo 2',cursive; font-weight:800; color:#fff;
  text-shadow: 0 2px 3px rgba(0,0,0,.8); z-index:4;
}
#mana{ top:2px; right:2px; width:78px; height:78px; font-size:42px; }
#atk{ left:10px; bottom:12px; width:72px; height:72px; font-size:40px; }
#hp{ right:10px; bottom:12px; width:72px; height:72px; font-size:40px; }
.gembadge:empty{ display:none; }  /* relics have no ATK/HP; Infinity Castle has no cost */

/* ===== CAMP / ALIGNMENT RAILS (vertical text beside the description) ===== */
.railtext{
  position:absolute; color:#fff; font-weight:800; font-size:30px; letter-spacing:.5px;
  text-shadow:0 2px 4px rgba(0,0,0,.85); white-space:nowrap;
  height:362px; display:flex; align-items:center; justify-content:center;
}
#camp{  left:2px;  top:550px; writing-mode:vertical-rl; transform:rotate(180deg); }
#align{ right:2px; top:550px; writing-mode:vertical-rl; }

/* ===== DESCRIPTION PANEL (fixed tall box, ends just above flavour) ===== */
#desc{
  position:absolute; left:48px; right:48px; top:550px; height:340px;
  border-radius:16px;
  background: linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.52)),
             linear-gradient(180deg, var(--panel-light), var(--panel-dark));
  border:3px solid var(--metal-mid);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.45), inset 0 2px 10px rgba(0,0,0,.5), 0 3px 8px rgba(0,0,0,.4);
  display:flex; align-items:flex-start; justify-content:center; padding:30px 22px 16px;
}
#desc .txt{
  color:#fff; font-family:'Nunito',sans-serif; font-weight:700; font-size:37px; line-height:1.16;
  text-align:center; text-shadow:0 2px 3px rgba(0,0,0,.7);
}

/* ===== FLAVOUR (bigger) + ORIGIN (smaller), fixed at the bottom of the card.
   The description box is grown by JS to end just above the flavour text. ===== */
#flavor{
  position:absolute; left:70px; right:70px; bottom:40px; height:84px; overflow:hidden;
  display:flex; align-items:flex-end; justify-content:center; text-align:center;
  font-family:'Nunito',sans-serif; font-style:italic; font-weight:600; color:#f3ecdc;
  font-size:34px; line-height:1.1; text-shadow:0 2px 3px rgba(0,0,0,.85);
}
#flavor .ftext{ display:block; }
#origin{
  position:absolute; left:0; right:0; bottom:14px; text-align:center;
  font-family:'Nunito',sans-serif; font-weight:700; color:#e9e1cd; opacity:.9;
  font-size:15px; letter-spacing:2px; text-transform:uppercase;
  text-shadow:0 2px 3px rgba(0,0,0,.85);
}
</style>
</head>
<body>
<div id="canvas" style="{{THEME_VARS}}">
  <div id="card">
    <div id="well">
      <div id="art"><img src="{{ART}}"></div>
      <div id="desc"><div class="txt">{{EFFECT}}</div></div>
      <div class="railtext" id="camp">{{CAMP}}</div>
      <div class="railtext" id="align">{{ALIGN}}</div>
      <div id="flavor"><span class="ftext">{{FLAVOR}}</span></div>
      <div id="origin">{{ORIGIN}}</div>
    </div>
    <div id="banner"><span class="name">{{NAME}}</span></div>
    <div class="gembadge" id="mana">{{MANA}}</div>
    <div class="gembadge" id="atk">{{ATK}}</div>
    <div class="gembadge" id="hp">{{HP}}</div>
  </div>
</div>
</body>
</html>
